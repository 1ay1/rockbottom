name: ci

# Build rockbottom, run the headless render/topology tests, and smoke-run the
# `rb` binary on every push / PR across all supported platforms. rockbottom
# targets Linux (x86_64 + arm64) and Apple Silicon macOS — there is no Windows
# backend, and Intel macOS is not built (the macos-13 runner image is retired).
# The matrix exercises each per-platform backend (procfs/sysfs on Linux,
# mach/IOKit on macOS) where it actually runs.
#
# maya is a git submodule, so every checkout is recursive. macOS builds with
# Homebrew GCC (Apple Clang's libc++ lacks std::move_only_function, which maya
# requires) — the same toolchain maya's own CI uses.

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build+smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
          - name: linux-arm64
            os: ubuntu-24.04-arm
            cc: gcc-14
            cxx: g++-14
          - name: macos-arm64
            os: macos-14        # Apple Silicon runner
            cc: gcc-14
            cxx: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake ninja-build

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc@14 cmake ninja || true

      - name: Configure
        shell: bash
        run: |
          export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      # rb_tests is EXCLUDE_FROM_ALL (a normal build shouldn't pay for it), so
      # it has to be asked for by name. It renders the real widgets onto an
      # off-screen canvas and asserts the per-core grid columns line up at every
      # width, plus drives the pure Linux topology classifier over fixtures.
      - name: Build + run tests
        run: |
          cmake --build build --target rb_tests -j
          ./build/rb_tests

      - name: Smoke-run the binary
        shell: bash
        run: |
          ./build/rb --version
          ./build/rb --help
