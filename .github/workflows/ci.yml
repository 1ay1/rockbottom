name: ci

# Build rockbottom, run the headless render/topology tests, and smoke-run the
# `rb` binary on every push / PR across all supported platforms. rockbottom
# targets Linux (x86_64 + arm64) and Apple Silicon macOS — there is no Windows
# backend, and Intel macOS is not built (the macos-13 runner image is retired).
# The matrix exercises each per-platform backend (procfs/sysfs on Linux,
# mach/IOKit on macOS) where it actually runs.
#
# maya is a git submodule, so every checkout is recursive. macOS builds with
# Homebrew GCC (Apple Clang's libc++ lacks std::move_only_function, which maya
# requires) — the same toolchain maya's own CI uses.

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build+smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
          - name: linux-arm64
            os: ubuntu-24.04-arm
            cc: gcc-14
            cxx: g++-14
          - name: macos-arm64
            os: macos-14        # Apple Silicon runner
            cc: gcc-14
            cxx: g++-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake ninja-build

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc@14 cmake ninja || true

      - name: Configure
        shell: bash
        run: |
          export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          # Default is ON; state it so CI exercises the exact standalone link
          # the release uses (and CMake's post-build assert_standalone check).
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRB_STANDALONE=ON

      - name: Build
        run: cmake --build build -j

      # The render tests are wired into CTest (add_test in CMakeLists) and,
      # with BUILD_TESTING on (default), built as part of the normal `all`
      # target above. They render the real widgets onto an off-screen canvas
      # and assert the per-core grid columns line up at every width, plus drive
      # the pure Linux topology classifier over fixtures.
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-run the binary
        shell: bash
        run: |
          ./build/rb --version
          ./build/rb --help
          # Run the REAL collectors on the runner's hardware and assert the
          # data is sane (non-empty proc list, our pid present, cpu 0..1, mem
          # used <= total). This is the only CI step that exercises the
          # per-platform sampler at all — --version/--help exit before it and
          # rb_tests only covers the UI grid + topology classifier.
          ./build/rb --selfcheck

      # Exercise the topology probe against the runner's REAL hardware — the
      # only place the Linux sysfs classifier runs on Linux, since the unit
      # tests drive it over in-memory fixtures. CI runners are ordinary
      # homogeneous VMs, so the meaningful assertion is the NEGATIVE one: the
      # probe must not invent a P/E split out of frequency scatter or
      # favoured-core boost. That false positive is exactly what the ~15%
      # spread threshold exists to prevent, and it would put a bogus cluster
      # column on every ordinary server.
      - name: Topology probe
        shell: bash
        run: |
          ./build/rb --topology | tee /tmp/topo.txt
          if [ "${{ runner.os }}" = "Linux" ] && grep -q heterogeneous /tmp/topo.txt; then
            echo "::error::classifier reported a P/E split on a homogeneous CI runner"
            exit 1
          fi

      # PORTABILITY, checked on every push rather than only at release.
      #
      # The release gate used to be the only place this was verified, and it
      # was checking the wrong property ("no libstdc++" instead of "no host
      # symbol deps"), so a binary importing GLIBC_2.29…2.38 from the runner's
      # glibc shipped and aborted before main() on stable enterprise hosts.
      # Catching it here means a portability regression fails the PR that
      # introduces it, when the cause is one commit away instead of a tag.
      #
      # A default `cmake -B build` must produce a portable binary — if you have
      # to remember a flag, the default is wrong.
      - name: Binary must be portable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          fail=0

          file build/rb
          file build/rb | grep -q 'statically linked' || {
            echo "::error::build/rb is not static — it will only run where glibc"
            echo "::error::is at least as new as this runner's. See RB_STANDALONE."
            fail=1; }

          vers=$(objdump -T build/rb 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV || true)
          if [ -n "$vers" ]; then
            echo "::error::build/rb imports versioned glibc symbols:"
            echo "$vers"
            fail=1
          fi

          # The strongest statement of "standalone" that can be made without a
          # second machine: run it in a chroot holding NOTHING but the binary.
          # No /lib, no /usr, no glibc. If it starts there, it starts anywhere
          # with a compatible kernel.
          jail=$(mktemp -d)
          cp build/rb "$jail/rb"
          sudo chroot "$jail" /rb --version || {
            echo "::error::build/rb cannot run in an empty chroot — it still needs"
            echo "::error::something from the host filesystem."
            fail=1; }

          [ "$fail" -eq 0 ] || exit 1
          echo "ok: build/rb is self-contained"

      # macOS portability, checked on every push instead of only at release.
      # A fully static mach-o is impossible (Apple ships no libc.a), so the
      # bar is: link nothing outside /usr/lib + /System/Library, and carry a
      # deployment floor low enough to launch on older Macs. CMake's
      # post-build assert_standalone already fails the Build step on a
      # violation, but assert it here too so the intent is visible in CI logs.
      - name: Binary must be portable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          echo "== otool -L"; otool -L build/rb
          bad=$(otool -L build/rb | tail -n +2 | awk '{print $1}' \
                | grep -v '^/usr/lib/' | grep -v '^/System/Library/' || true)
          if [ -n "$bad" ]; then
            echo "::error::build/rb links libraries that ship with no other Mac:"
            echo "$bad"; fail=1
          fi
          minos=$(otool -l build/rb | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          echo "== minos $minos (must be <= 11.0)"
          if [ -n "$minos" ]; then
            lowest=$(printf '11.0\n%s\n' "$minos" | sort -V | head -1)
            if [ "$lowest" != "$minos" ] && [ "$minos" != "11.0" ]; then
              echo "::error::build/rb requires macOS $minos — too new for older Macs"
              fail=1
            fi
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "ok: build/rb is standalone on macOS"

      # RB_STANDALONE=OFF is the distro-package path (link against the system
      # libstdc++ so the package manager owns the ABI). Nobody builds that way
      # day to day, so it silently rots unless CI compiles it.
      - name: Distro-package link mode still builds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          cmake -B build-shared -G Ninja -DCMAKE_BUILD_TYPE=Release -DRB_STANDALONE=OFF
          cmake --build build-shared -j
          ./build-shared/rb --version

  # The Linux RELEASE binaries are built against musl (Alpine), not glibc — it
  # is what makes them genuinely static with no glibc version floor. That
  # toolchain is different enough from the glibc build above (different libc,
  # different libstdc++ headers) that it has to be exercised on every push, or
  # a musl-only compile break is discovered only at tag time. This job builds
  # exactly the way release.yml does and runs the full standalone proof:
  # static ELF, no versioned imports, and starts in an empty chroot.
  musl:
    name: musl static (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build + prove standalone (Alpine/musl)
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:edge sh -euc '
            # NB: alpine:edge folded the static libstdc++.a into the g++
            # package — the standalone `libstdc++-static` apk was removed, so
            # requesting it now aborts with "no such package".
            apk add --no-cache \
              build-base g++ gcc musl-dev cmake ninja \
              libgcc binutils file
            export CC=gcc CXX=g++
            cmake -B build-musl -G Ninja -DCMAKE_BUILD_TYPE=Release -DRB_STANDALONE=ON
            cmake --build build-musl -j
            ./build-musl/rb --version
            ./build-musl/rb --help
            # Run the real collectors under musl and assert sane data — catches
            # a libc-specific difference in /proc parsing that a static-ELF
            # check never would.
            ./build-musl/rb --selfcheck

            # rb_tests is EXCLUDE_FROM_ALL; build + run it under musl too.
            cmake --build build-musl --target rb_tests -j
            ./build-musl/rb_tests

            fail=0
            file build-musl/rb
            file build-musl/rb | grep -q "statically linked" || {
              echo "::error::musl build is not statically linked"; fail=1; }

            # A static ELF has no UND imports at all — any versioned symbol
            # (GLIBC_* or otherwise) means the link leaked a shared dep.
            vers=$(objdump -T build-musl/rb 2>/dev/null | grep -o "GLIBC_[0-9.]*" | sort -uV || true)
            [ -z "$vers" ] || { echo "::error::musl build imports versioned glibc symbols: $vers"; fail=1; }

            # No dynamic-loader INTERP segment.
            readelf -l build-musl/rb | grep -qi "program interpreter" \
              && { echo "::error::musl build has a dynamic interpreter"; fail=1; } || true

            # Empty-chroot smoke test: start with NOTHING but the binary.
            jail=$(mktemp -d); cp build-musl/rb "$jail/rb"
            chroot "$jail" /rb --version \
              || { echo "::error::musl build is not self-contained"; fail=1; }

            [ "$fail" -eq 0 ] || exit 1
            echo "ok: musl build is fully static and self-contained"
          '

  # AddressSanitizer + UndefinedBehaviorSanitizer over the real sampler. The
  # /proc collector was rewritten to read files via raw open()/read() into a
  # reused buffer (slurp_into) with in-place pointer parsing — exactly the code
  # where a one-byte overread or a use-after-overwrite hides behind
  # plausible-looking output. --selfcheck drives every collector, so ASan sees
  # the actual /proc parsing on the runner's processes. Built non-static
  # (RB_STANDALONE=OFF) because -static and the sanitizer runtimes don't mix.
  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake ninja-build
      - name: Build with sanitizers
        shell: bash
        run: |
          export CC=gcc-14 CXX=g++-14
          cmake -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRB_STANDALONE=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake --build build-san -j
          cmake --build build-san --target rb_tests -j
      - name: Run under ASan/UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # The headless UI grid + topology suite …
          ./build-san/rb_tests
          # … then the real collectors, the code most likely to trip ASan.
          ./build-san/rb --selfcheck
          ./build-san/rb --topology >/dev/null
