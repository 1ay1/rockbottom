name: release

# On a `v*` tag (or manual dispatch), build a stripped standalone `rb` binary
# for every supported platform/arch and publish them as GitHub Release assets.
# Binaries are deliberately NOT committed into the tree (d8dac27) — a repo that
# carries its own build artifacts grows without bound and invites the "is the
# checked-in binary current?" question on every clone.
#
# Supported platforms: Linux (x86_64 + arm64) and Apple Silicon macOS. There is
# deliberately no Windows build, and no Intel macOS build (the macos-13 runner
# image is retired). maya is a submodule → recursive checkout; macOS builds with
# Homebrew GCC.
#
# Asset names embed platform + arch so all three coexist:
#   rb-linux-x86_64  rb-linux-arm64  rb-macos-arm64

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: rb-linux-x86_64
            os: ubuntu-latest
          - asset: rb-linux-arm64
            os: ubuntu-24.04-arm
          - asset: rb-macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake ninja-build

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc@14 cmake ninja || true

      - name: Build (Release, stripped)
        shell: bash
        run: |
          export CC=gcc-14 CXX=g++-14
          # -DRB_STANDALONE=ON is the default, but say it out loud: this is the
          # release path and a portable binary is the whole point. Being
          # explicit means a future flip of the default can never silently turn
          # published assets dynamic. (CMake also runs its own post-build
          # standalone assertion, so a bad link fails here, not on a user's box.)
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRB_STANDALONE=ON
          cmake --build build -j
          # CMake already strips the Release binary; verify + rename to the
          # platform-tagged asset name.
          ./build/rb --version
          cp build/rb "${{ matrix.asset }}"

      # The bootstrapper is POSIX sh. Users commonly paste the command into
      # Bash, so test both execution paths before publishing it as an asset.
      - name: Installer must work in sh and Bash
        shell: bash
        run: |
          sh -n install.sh
          bash -n install.sh
          sh install.sh --help
          bash install.sh --help

      - name: Include installer
        if: matrix.asset == 'rb-linux-x86_64'
        run: cp install.sh install.sh.release

      # The version has exactly one source (the project() line in
      # CMakeLists.txt, via the generated core/version.hpp) — but the TAG is
      # typed by hand, so it's the one thing that can still disagree with it.
      # Publishing v0.2.0 assets from a binary that says 0.1.0 is silent,
      # permanent, and only ever discovered by a confused user. Fail here
      # instead, before anything is uploaded.
      - name: Tag must match the binary version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(./build/rb --version | awk '{print $2}')"
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != binary version ${built} — bump project(rockbottom VERSION ...) in CMakeLists.txt"
            exit 1
          fi

      # We advertise these as standalone binaries ("no build, no deps"), and
      # THE RELEASE GATE. Three shipped-broken releases came through here, so
      # this step is deliberately paranoid about the one thing a --version
      # smoke test on the BUILDER can never catch: a dependency that exists
      # here and nowhere else.
      #
      #   v0.1.0 (macOS) referenced Homebrew GCC's libstdc++.6.dylib and died
      #   in dyld before main() on every machine but the runner's.
      #
      #   Then the Linux artifact passed a check that only grepped for
      #   libstdc++/libgcc_s while still importing GLIBC_2.29…2.38 from the
      #   runner's glibc 2.39 — so it aborted on any stable enterprise host
      #   with a wall of "version `GLIBC_2.xx' not found (required by rb)".
      #   Passing "no libstdc++" is NOT the same as being portable.
      #
      # So on Linux we now assert the strongest available property: the image
      # is fully static and imports NO versioned symbol from any host library.
      # That is checkable, and it is what "standalone" actually means.
      - name: Binary must be standalone
        shell: bash
        run: |
          set -uo pipefail
          asset="${{ matrix.asset }}"
          fail=0

          if [ "${{ runner.os }}" = "macOS" ]; then
            # Apple ships no libc.a, so a fully static mach-o isn't possible.
            # The achievable bar: nothing outside the OS's own directories.
            echo "== otool -L $asset"; otool -L "$asset"
            # tail -n +2 drops the header (the binary's own path). @rpath /
            # @loader_path / @executable_path references are ALSO leaks: they
            # resolve to a dir that only exists on the builder, so reject any
            # dylib not rooted in /usr/lib or /System/Library.
            bad=$(otool -L "$asset" | tail -n +2 | awk '{print $1}' \
                  | grep -v '^/usr/lib/' | grep -v '^/System/Library/' || true)
            if [ -n "$bad" ]; then
              echo "::error::$asset links libraries that ship with no other Mac:"
              echo "$bad"; fail=1
            fi

            # DEPLOYMENT FLOOR. otool -L on the RUNNER can't catch this: a
            # binary linked on macos-14 stamps a minimum-macOS load command of
            # 14.0 and dyld then refuses it on macOS 12/13 ("built for newer
            # version of macOS") before main() — the same shape of
            # build-host-leak that killed v0.1.0, just via the SDK version
            # instead of a dylib path. We build with
            # CMAKE_OSX_DEPLOYMENT_TARGET=11.0, so assert the artifact agrees.
            minos=$(otool -l "$asset" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "== minos $minos (must be <= 11.0)"
            if [ -n "$minos" ]; then
              # Sort the two versions; if 11.0 isn't the greater-or-equal one,
              # the floor is too high.
              lowest=$(printf '11.0\n%s\n' "$minos" | sort -V | head -1)
              if [ "$lowest" != "$minos" ] && [ "$minos" != "11.0" ]; then
                echo "::error::$asset requires macOS $minos — it will not launch"
                echo "::error::on older Macs. Set CMAKE_OSX_DEPLOYMENT_TARGET."
                fail=1
              fi
            fi
          else
            # 1. Fully static — no interpreter, so no host loader involvement.
            echo "== file $asset"; file "$asset"
            if ! file "$asset" | grep -q 'statically linked'; then
              echo "::error::$asset is NOT statically linked — it will inherit the"
              echo "::error::builder's glibc version floor. Check RB_STANDALONE."
              file "$asset"; fail=1
            fi

            # 2. No dynamic dependencies at all.
            if ldd "$asset" 2>&1 | grep -qv 'not a dynamic executable'; then
              echo "::error::$asset has dynamic dependencies:"
              ldd "$asset" 2>&1; fail=1
            fi

            # 3. THE REGRESSION THAT SHIPPED: zero imported versioned symbols.
            #    This is the check whose absence let GLIBC_2.29…2.38 out the
            #    door. objdump -T on a static binary lists no UND imports at
            #    all, so any GLIBC_* here means we regressed to dynamic glibc.
            vers=$(objdump -T "$asset" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' \
                   | sort -uV || true)
            if [ -n "$vers" ]; then
              echo "::error::$asset imports versioned glibc symbols — it will fail"
              echo "::error::on any host with an older glibc than this runner:"
              echo "$vers"; fail=1
            fi

            # 4. It must actually START with literally nothing from the host
            # filesystem available. Run this for EVERY Linux architecture,
            # not merely x86_64: a static ELF that is the wrong architecture
            # also fails here rather than becoming a broken release asset.
            echo "== smoke test in an empty chroot"
            jail=$(mktemp -d)
            cp "$asset" "$jail/rb"
            sudo chroot "$jail" /rb --version \
              || { echo "::error::$asset is not self-contained"; fail=1; }

            # An old userspace additionally catches accidental dynamic-glibc
            # linkage on x86_64 with a real foreign loader.
            if [ "${{ matrix.asset }}" = "rb-linux-x86_64" ]; then
              echo "== smoke test under centos:7 (glibc 2.17)"
              docker run --rm --platform linux/amd64 \
                -v "$PWD/$asset:/rb:ro" centos:7 /rb --version \
                || { echo "::error::$asset does not run on glibc 2.17"; fail=1; }
            fi
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "ok: $asset is standalone"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            install.sh.release
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full source tarball (below) needs maya's contents, and it must be a
          # real repo so `git archive` works.
          submodules: recursive
          fetch-depth: 0

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: staged
          merge-multiple: true

      - name: Bundle full source (superproject + submodules)
        # GitHub's auto "Source code.tar.gz" omits submodules and isn't a git
        # checkout, so users can't build or `git submodule update` (issue #10).
        # We emit a self-contained tarball: `git archive` the superproject, then
        # `git archive` every initialised submodule into its correct subdir, so
        # the extracted tree builds offline with no network and no .git needed.
        run: |
          set -euo pipefail
          REF="${GITHUB_REF#refs/tags/}"
          NAME="rockbottom-${REF}"
          WORK="$(mktemp -d)"
          DEST="$WORK/$NAME"
          mkdir -p "$DEST"
          # Superproject tree at this ref/commit.
          git archive --format=tar HEAD | tar -x -C "$DEST"
          # Each submodule, placed at its recorded path.
          git submodule --quiet foreach --recursive '
            mkdir -p "'"$DEST"'/$sm_path"
            git archive --format=tar HEAD | tar -x -C "'"$DEST"'/$sm_path"
          '
          tar -C "$WORK" -czf "staged/${NAME}-full-source.tar.gz" "$NAME"
          echo "built staged/${NAME}-full-source.tar.gz"
          ( cd "$DEST" && test -f third_party/maya/CMakeLists.txt ) \
            && echo "OK: maya bundled" \
            || { echo "::error::maya missing from source bundle"; exit 1; }

      - name: Checksums
        run: |
          cd staged
          mv install.sh.release install.sh
          chmod +x rb-* install.sh
          sha256sum rb-* *-full-source.tar.gz | tee SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            staged/rb-*
            staged/install.sh
            staged/*-full-source.tar.gz
            staged/SHA256SUMS
          generate_release_notes: true
